{% extends "base.html" %}
{% block title %}MFD Products{% endblock %}

{% block content %}
<h1>MFD Products</h1>
<div class="row mb-3">
    <div class="col-md-6">
        <form method="GET" action="{{ url_for('list_products') }}">
            <div class="input-group">
                <input type="text" class="form-control" name="q" placeholder="Search products..." value="{{ request.args.get('q', '') }}">
                <button class="btn btn-outline-secondary" type="submit">Search</button>
            </div>
        </form>
    </div>
    <div class="col-md-6">
        <div class="float-end">
            <a href="{{ url_for('add_product') }}" class="btn btn-primary">Add Product</a>
        </div>
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <form method="GET" action="{{ url_for('list_products') }}">
            <div class="row">
                <div class="col-md-3">
                    <label for="min_price" class="form-label">Min Price</label>
                    <input type="number" class="form-control" name="min_price" id="min_price" 
                           value="{{ request.args.get('min_price', '') }}" step="0.01">
                </div>
                <div class="col-md-3">
                    <label for="max_price" class="form-label">Max Price</label>
                    <input type="number" class="form-control" name="max_price" id="max_price" 
                           value="{{ request.args.get('max_price', '') }}" step="0.01">
                </div>
                <div class="col-md-3">
                    <label for="sort" class="form-label">Sort By</label>
                    <select class="form-select" name="sort" id="sort">
                        <option value="name_asc" {% if request.args.get('sort') == 'name_asc' %}selected{% endif %}>Name (A-Z)</option>
                        <option value="name_desc" {% if request.args.get('sort') == 'name_desc' %}selected{% endif %}>Name (Z-A)</option>
                        <option value="price_asc" {% if request.args.get('sort') == 'price_asc' %}selected{% endif %}>Price (Low-High)</option>
                        <option value="price_desc" {% if request.args.get('sort') == 'price_desc' %}selected{% endif %}>Price (High-Low)</option>
                    </select>
                </div>
                <div class="col-md-3 align-self-end">
                    <button type="submit" class="btn btn-primary w-100">Filter</button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Rest of the table code remains the same -->

<h1>Products</h1>
<a href="{{ url_for('add_product') }}" class="btn btn-primary mb-3">Add Product</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>${{ "%.2f"|format(product.price) }}</td>
            <td>
                <a href="{{ url_for('edit_product', id=product.id) }}" class="btn btn-sm btn-warning">Edit</a>
                <form action="{{ url_for('delete_product', id=product.id) }}" method="POST" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
